<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث عن نتيجة الثانوية العامة</title>
    <!-- Google Font Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-bg: #f0fdf4;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            transition: box-shadow 0.2s ease;
        }

        .search-card:focus-within {
            box-shadow: var(--shadow-lg);
        }

        .search-box {
            display: flex;
            gap: 0.75rem;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            font-size: 1.1rem;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: right;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-button {
            padding: 0.75rem 2rem;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-button:hover {
            background-color: var(--primary-hover);
        }

        .loader {
            display: none;
            justify-content: center;
            align-items: center;
            margin: 2rem 0;
        }

        .spinner {
            width: 2.5rem;
            height: 2.5rem;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(-360deg); }
        }

        .results-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .student-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .student-info h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: var(--text-main);
        }

        .student-info p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .student-stats {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .degree-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .degree-info .percentage {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }

        .degree-info .score {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            min-width: 100px;
        }

        .status-badge.passed {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(22, 163, 74, 0.2);
        }

        .status-badge.failed {
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(220, 38, 38, 0.2);
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            .student-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .student-stats {
                width: 100%;
                justify-content: space-between;
                flex-direction: row-reverse;
            }
            .degree-info {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>البحث عن نتيجة الثانوية العامة</h1>
            <p>ابحث باسمك أو رقم جلوسك للحصول على تفاصيل النتيجة والنسبة المئوية</p>
        </header>

        <main>
            <div class="search-card">
                <form id="search-form" onsubmit="handleSearch(event)">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="search-input" 
                            class="search-input" 
                            placeholder="اكتب رقم الجلوس أو اسم الطالب للبحث..."
                            autocomplete="off"
                            required
                        >
                        <button type="submit" class="search-button">بحث</button>
                    </div>
                </form>
            </div>

            <div class="loader" id="loader">
                <div class="spinner"></div>
            </div>

            <div class="results-container" id="results">
                <!-- Results will be dynamically populated here -->
            </div>
        </main>

            <footer style="text-align: center; margin-top: 2rem; padding: 1.5rem 0; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.95rem;">
            <div style="margin-bottom: 0.75rem; font-size: 0.9rem;">
                عدد الزوار: <span id="visitor-count" style="font-weight: 700; color: var(--primary);">-</span>
            </div>
            تم تطوير الموقع بواسطة
            <a href="https://www.facebook.com/dev3mora/" target="_blank" rel="noopener" style="color: var(--primary); text-decoration: none; font-weight: 700;">
                م عمر أبوالخير
            </a>
        </footer>
    </div>

    <script>
        let debounceTimer;
        const searchInput = document.getElementById('search-input');
        const resultsContainer = document.getElementById('results');
        const loader = document.getElementById('loader');

        // Automatic search on typing with debounce
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const query = searchInput.value.trim();
            if (query.length >= 2) {
                debounceTimer = setTimeout(() => {
                    performSearch(query);
                }, 300);
            } else if (query.length === 0) {
                resultsContainer.innerHTML = '';
            }
        });

        function handleSearch(event) {
            event.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                performSearch(query);
            }
        }

        async function performSearch(query) {
            loader.style.display = 'flex';
            resultsContainer.innerHTML = '';

            try {
                // Point to Vercel api endpoint
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                loader.style.display = 'none';

                if (data.results && data.results.length > 0) {
                    renderResults(data.results);
                } else {
                    resultsContainer.innerHTML = `
                        <div class="no-results">
                            لا توجد نتائج مطابقة لـ "${query}"
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Search error:", error);
                loader.style.display = 'none';
                resultsContainer.innerHTML = `
                    <div class="no-results" style="color: var(--danger)">
                        حدث خطأ أثناء الاتصال بالخادم. يرجى المحاولة لاحقاً.
                    </div>
                `;
            }
        }

        // Fetch and display visitor count
        async function fetchVisitorCount() {
            try {
                const response = await fetch('/api/visitors');
                const data = await response.json();
                document.getElementById('visitor-count').textContent = data.count.toLocaleString();
            } catch (e) {
                document.getElementById('visitor-count').textContent = '؟';
            }
        }
        fetchVisitorCount();

        function renderResults(students) {
            resultsContainer.innerHTML = students.map(student => `
                <div class="student-card">
                    <div class="student-info">
                        <h3>${student.name}</h3>
                        <p>رقم الجلوس: <strong>${student.seating_no}</strong></p>
                    </div>
                    <div class="student-stats">
                        <div class="status-badge ${student.passed ? 'passed' : 'failed'}">
                            ${student.status_text}
                        </div>
                        <div class="degree-info">
                            <span class="percentage">${student.percentage}%</span>
                            <span class="score">${student.degree} / 320</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
